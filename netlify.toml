# netlify.toml — Netlify configuration for PokerIQ

[build]
  publish = "."
  command = "node inject-config.js"

[build.environment]
  NETLIFY_SKIP_SECRET_SCAN = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
